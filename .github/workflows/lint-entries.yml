# Style-guide gate for entries.
#
# The doctrine in SKILL.md section 4 governs every future entry, and prose is
# something a model drifts from — the two entries written by a stale copy of
# the skill were the worst on the site, and one of them shipped an HTML-escaped
# section name that rendered as "CROSS-COVER &AMP; ACUTE CARE" in production.
# This turns the guide into something that fails.
name: Lint entries

on:
  push:
    branches: [main, draft]
    paths: ['entries/**', 'manifest.json', 'tools/lint_entries.py', '.github/workflows/lint-entries.yml']
  pull_request:
    paths: ['entries/**', 'manifest.json', 'tools/lint_entries.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Entry style guide
        run: python3 tools/lint_entries.py
      - name: Doctrine drift across the six copies
        run: python3 tools/check_doctrine_drift.py
