<img class="photo" src="entries/img/2026-08-08-antiarrhythmic-drugs-1.jpg" alt="Anti-arrhythmic drugs Class I: normal ventricular action potential phases 0-4, effective refractory period, Class I effects on action potential duration (1a prolongs, 1b shortens, 1c minimal). Comparison table of Class 1a vs 1b vs 1c — uses, Na+ and K+ channel effects, APD, ERP, QRS, QT. Examples: procainamide (hypotension, lupus-like syndrome), quinidine (GI, cinchonism, thrombocytopenia), disopyramide (anticholinergic, avoid in heart failure), lidocaine (2nd line in MI arrhythmias, neuro and cardiovascular effects), phenytoin, flecainide and propafenone (dizziness, visual disturbance, exacerbate heart failure, prolong QT). Class 1a can induce torsades de pointes; Class 1c is proarrhythmic — do not use with structural heart disease.">
<img class="photo" src="entries/img/2026-08-08-antiarrhythmic-drugs-2.jpg" alt="Anti-arrhythmic drugs Classes II-V. Class II beta blockers: slow SA and AV nodal conduction, inhibit phase 4 depolarization, prolong PR; propranolol, metoprolol, nadolol, timolol, esmolol; side effects bradycardia, hypotension, bronchospasm. Class III potassium channel blockers: delay repolarization, prolong APD and ERP and QT; amiodarone (liver toxicity, interstitial pneumonitis, corneal microdeposits, photosensitivity, thyroid disorders), dronedarone, sotalol (torsades). Class IV calcium channel blockers: verapamil and diltiazem, prolong PR, avoid in HFrEF, caution with beta blockers. Others: adenosine for SVT, magnesium for torsades and digoxin toxicity, potassium, digoxin for atrial fibrillation and flutter via Na/K ATPase inhibition.">
