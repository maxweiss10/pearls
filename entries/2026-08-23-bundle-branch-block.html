  <img class="photo" src="entries/img/2026-08-23-bundle-branch-block-1.jpg" alt="Flow chart for diagnosing bundle branch block. Two entry gates side by side: supraventricular rhythm, P wave before each QRS, paced or VT stop here; and QRS greater than or equal to 120 ms, widest lead onset to offset, 110 to 119 ms equals incomplete. These converge on the branch: terminal 40 ms in V1, read only the last 40 ms, which side of baseline? Beside it the mnemonic Max is always RIGHT, ends up in V1 equals RBBB, not just starts up. Left branch RBBB, terminal deflection positive in V1, rsR prime, notched R, qR, or plain R, with four labelled V1 tracings: tall R prime showing r, S and R prime; notched R; qR showing q and R; and no notch, a smooth mound. Right branch LBBB, terminal deflection negative in V1, QS or rS, a small r is allowed, with four labelled V1 tracings: deep QS; small r showing r and S; notched QS; and broad QS. Below the RBBB branch, confirm in I and V6, S wider than R or greater than 40 ms, a septal q here is fine, with four labelled tracings: deep S, shallow S, slurred S, and qRS showing q, R and S. Below the LBBB branch, confirm in I and V6, broad monophasic R wave, no q in I, aVL, V5, V6, a q refutes, with four labelled tracings each marked no q: notched, plateau, smooth, and late slur. Both branches converge on the exit box: if either half fails, IVCD; both halves are required, not either; nonspecific conduction delay, not BBB.">
